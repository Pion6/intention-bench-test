[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "intent-bench"
version = "0.1.0"
description = "Mobile Banking & Cross-Domain Intent Recognition Benchmark: Decision 3.0 (vllm-sr/d3) vs. GLM 5.3"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27.0",
    "pyarrow>=15.0.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
intent-bench = "intent_bench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
